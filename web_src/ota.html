<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B1020">
<title>OTA 固件升级 · MOCHAN</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-1:#050816;--bg-2:#0B1030;--bg-3:#101A4A;
  --glass:rgba(255,255,255,.06);--glass-2:rgba(255,255,255,.10);
  --border:rgba(255,255,255,.12);
  --text:#E8ECF5;--text-2:#A8B0C5;--text-3:#76809A;
  --accent:#5B8CFF;--accent-2:#8A6BFF;--accent-g:linear-gradient(135deg,#5B8CFF,#8A6BFF 60%,#FF6BD6);
  --danger:#FF4D6A;--success:#3DDC97;--warn:#FFB547;
  --r-lg:26px;--r-md:18px;--r-sm:12px;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  color:var(--text);min-height:100vh;
  background-image:
    radial-gradient(1200px 600px at 10% -10%,rgba(91,140,255,.35),transparent 60%),
    radial-gradient(900px 500px at 110% 10%,rgba(138,107,255,.28),transparent 55%),
    linear-gradient(180deg,var(--bg-1),var(--bg-2) 55%,var(--bg-3));
  padding:22px 16px 80px;overflow-x:hidden;
}
.container{max-width:560px;margin:0 auto}

.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 20px}
.back{display:inline-flex;align-items:center;gap:6px;appearance:none;border:1px solid var(--border);
  background:var(--glass);color:var(--text);padding:8px 12px;border-radius:999px;cursor:pointer;
  font-size:12.5px;font-weight:600;backdrop-filter:blur(10px);transition:all .2s;
}
.back:hover{background:var(--glass-2);transform:translateY(-1px)}
.brand{font-size:12.5px;font-weight:700;letter-spacing:1.5px;color:var(--text-2)}

.card{
  position:relative;margin-top:12px;border-radius:var(--r-lg);
  background:var(--glass);border:1px solid var(--border);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
  padding:22px 20px 22px;overflow:hidden;
}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 40%,transparent 60%,rgba(138,107,255,.18));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;pointer-events:none;
}
.card>*{position:relative;z-index:1}

.hero{text-align:center;padding:8px 4px 4px}
.hero .ico{
  display:inline-grid;place-items:center;width:72px;height:72px;border-radius:24px;margin:0 auto 14px;
  background:var(--accent-g);box-shadow:0 16px 44px rgba(91,140,255,.35),inset 0 1px 0 rgba(255,255,255,.25);
  font-size:32px;transform:translateY(0);animation:float 3.2s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hero h1{font-size:22px;font-weight:800;letter-spacing:.4px;
  background:var(--accent-g);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{margin-top:6px;font-size:12.5px;color:var(--text-3);line-height:1.6}

.warn-box{
  margin:16px 0 18px;padding:12px 14px;border-radius:var(--r-sm);
  background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.25);
  display:flex;align-items:flex-start;gap:10px;
}
.warn-box .icon{font-size:18px;line-height:1.2;flex:0 0 auto}
.warn-box .txt{font-size:12px;color:var(--text-2);line-height:1.65}
.warn-box .txt b{color:var(--warn)}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;padding-left:2px;font-weight:500}
.field .req{color:var(--danger);margin-left:2px}

/* Custom file upload */
.file{
  position:relative;border:1.5px dashed rgba(91,140,255,.35);border-radius:var(--r-md);
  background:rgba(8,12,30,.45);padding:22px 14px;text-align:center;cursor:pointer;transition:all .25s ease;
}
.file:hover{border-color:rgba(91,140,255,.75);background:rgba(8,12,30,.7);box-shadow:0 10px 30px rgba(91,140,255,.12)}
.file.drag{border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,140,255,.15),0 12px 36px rgba(91,140,255,.2)}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.file .cloud{font-size:34px;margin-bottom:8px}
.file .t1{font-size:13.5px;font-weight:700;color:var(--text)}
.file .t2{font-size:11.5px;color:var(--text-3);margin-top:4px}
.file .sel{margin-top:10px;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
  background:var(--glass);border:1px solid var(--border);font-size:11.5px;color:var(--text-2);max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.file .sel .ok{color:var(--success)}

.md5-field{display:flex;gap:8px;align-items:center}
.md5-field input{
  flex:1;appearance:none;border:1px solid var(--border);background:rgba(8,12,30,.55);
  color:var(--text);padding:12px 14px;border-radius:var(--r-sm);font-size:13px;outline:none;
  letter-spacing:.5px;font-family:"SF Mono","JetBrains Mono","Consolas",monospace;
  transition:border-color .2s,box-shadow .2s;
}
.md5-field input::placeholder{color:var(--text-3)}
.md5-field input:focus{border-color:transparent;box-shadow:0 0 0 2px rgba(91,140,255,.45)}
.md5-hint{font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.6}
.md5-hint code{display:inline-block;padding:1px 6px;border-radius:6px;background:var(--glass);border:1px solid var(--border);color:var(--text-2);font-size:10.5px}

/* Progress */
.prog{margin-top:16px;display:none}
.prog.show{display:block}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
.prog-top .pct{font-weight:700;color:var(--text)}
.prog-top .lbl{color:var(--text-3)}
.bar{height:10px;width:100%;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--border);overflow:hidden}
.bar > i{display:block;height:100%;width:0%;border-radius:999px;background:var(--accent-g);
  box-shadow:0 0 18px rgba(91,140,255,.5);transition:width .2s ease;position:relative}
.bar > i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shimmer 1.6s linear infinite;
}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

.log{margin-top:14px;padding:10px 12px;border-radius:var(--r-sm);background:rgba(0,0,0,.35);
  border:1px solid var(--border);font-family:"SF Mono","JetBrains Mono","Consolas",monospace;
  font-size:11.5px;color:var(--text-2);line-height:1.6;min-height:48px;max-height:160px;overflow:auto;
}
.log .ln{display:block}.log .ok{color:var(--success)}.log .err{color:var(--danger)}.log .dim{color:var(--text-3)}

/* Buttons */
.actions{display:flex;gap:10px;margin-top:18px}
.btn{appearance:none;border:none;cursor:pointer;padding:13px 14px;border-radius:var(--r-sm);
  font-size:14px;font-weight:700;letter-spacing:.3px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s ease;flex:1;
}
.btn:disabled{cursor:not-allowed;opacity:.55;filter:saturate(.6)}
.btn-primary{
  background:var(--accent-g);color:#fff;
  box-shadow:0 12px 28px rgba(91,140,255,.32),inset 0 1px 0 rgba(255,255,255,.2);
}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 36px rgba(91,140,255,.42)}
.btn-primary:active:not(:disabled){transform:translateY(0)}
.btn-ghost{background:var(--glass);color:var(--text);border:1px solid var(--border);flex:0 0 auto;padding:13px 16px}
.btn-ghost:hover{background:var(--glass-2)}
.btn .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.steps{margin:18px 0 2px;display:flex;gap:6px}
.steps .s{flex:1;height:4px;border-radius:999px;background:rgba(255,255,255,.06)}
.steps .s.a{background:var(--accent-g)}

.footer{margin-top:24px;text-align:center;font-size:11px;color:var(--text-3);letter-spacing:1.2px}
.footer .bar{margin:0 auto 8px;width:38px;height:4px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));opacity:.7}

/* ===== OTA 桌面/交互体验 ===== */
@media (hover:hover) and (pointer:fine){
  html{scroll-behavior:smooth}
  button:focus-visible,input:focus-visible{
    outline:none;box-shadow:0 0 0 3px rgba(91,140,255,.45),0 6px 24px rgba(91,140,255,.18);border-radius:inherit
  }
  ::selection{background:rgba(91,140,255,.35);color:#fff}
}
@media (min-width:768px) and (max-width:1023px){
  body{padding:28px 20px 80px}
  .container{max-width:640px}
  .card{padding:24px 22px}
}
@media (min-width:1024px){
  body{padding:40px 28px 100px}
  .container{max-width:720px}
  .top{padding:6px 4px 22px}
  .top .back{padding:9px 14px;font-size:13px}
  .top .brand{font-size:13px;letter-spacing:2px}
  .card{padding:28px 28px 26px;border-radius:28px;margin-top:14px}
  .hero .ico{width:80px;height:80px;border-radius:28px;font-size:36px}
  .hero h1{font-size:24px}
  .hero p{font-size:13px;margin-top:8px}
  .warn-box{padding:14px 16px;margin:18px 0 20px}
  .warn-box .icon{font-size:20px}
  .warn-box .txt{font-size:12.5px;line-height:1.7}
  .field{margin-bottom:16px}
  .field label{font-size:12.5px;margin-bottom:8px}
  .file{padding:28px 18px;border-radius:20px}
  .file .cloud{font-size:38px}
  .file .t1{font-size:14px}
  .file .t2{font-size:12px}
  .md5-field input{padding:13px 15px;font-size:14px}
  .md5-hint{font-size:11.5px;margin-top:8px;line-height:1.7}
  .prog-top{font-size:12.5px;margin-bottom:10px}
  .bar{height:11px}
  .log{padding:12px 14px;font-size:12px;line-height:1.7;max-height:200px}
  .actions{margin-top:20px;gap:12px}
  .btn{padding:14px 16px;font-size:14px;border-radius:14px}
  .steps{margin:20px 0 4px;gap:8px}
  .footer{margin-top:28px;font-size:12px}
}
@media (min-width:1440px){
  .container{max-width:780px}
  .card{padding:32px 32px 30px;border-radius:30px}
  body{padding:48px 40px 120px}
}
</style>
</head>
<body>
<div class="container">

  <div class="top">
    <button class="back" onclick="location.href='/'">← 返回控制台</button>
    <div class="brand">MOCHAN · OTA</div>
  </div>

  <div class="card">
    <div class="steps"><div class="s a"></div><div class="s"></div><div class="s"></div></div>

    <div class="hero">
      <div class="ico">⬆️</div>
      <h1>OTA 固件升级</h1>
      <p>空中固件升级 · 选择 <b style="color:var(--text)">.bin</b> 固件并上传，设备将自动写入并重启。</p>
    </div>

    <div class="warn-box">
      <span class="icon">⚠️</span>
      <div class="txt">
        <div><b>升级过程中请勿断电或刷新页面！</b></div>
        <div>建议使用已校验 MD5 的官方固件；若升级失败，请使用串口烧录方式恢复。</div>
      </div>
    </div>

    <form id="otaForm" method="POST" action="/update" enctype="multipart/form-data" novalidate>
      <div class="field">
        <label>固件文件 <span class="req">*</span></label>
        <label class="file" id="drop">
          <input type="file" name="firmware" id="firmware" accept=".bin,application/octet-stream">
          <div class="cloud">☁️</div>
          <div class="t1" id="fName">点击选择或拖拽 .bin 文件到此处</div>
          <div class="t2" id="fHint">仅支持 .bin 固件文件 · 建议 ≤ 4MB</div>
          <span class="sel" id="fSel" style="display:none"></span>
        </label>
      </div>

      <div class="field">
        <label>MD5 校验 <span style="color:var(--text-3);font-weight:400">(推荐，用于完整性校验)</span></label>
        <div class="md5-field">
          <input type="text" id="md5" name="md5" placeholder="例如：d41d8cd98f00b204e9800998ecf8427e" maxlength="32" autocomplete="off" spellcheck="false">
        </div>
        <div class="md5-hint">
          使用以下命令生成 MD5：
          <code>certutil -hashfile firmware.bin MD5</code> (Win) ·
          <code>md5 firmware.bin</code> (Mac) ·
          <code>md5sum firmware.bin</code> (Linux)
        </div>
      </div>

      <div class="prog" id="prog">
        <div class="prog-top"><span class="lbl" id="progLbl">上传中…</span><span class="pct" id="progPct">0%</span></div>
        <div class="bar"><i id="bar"></i></div>
      </div>

      <div class="log" id="log">
        <span class="ln dim">[ 系统就绪，等待上传固件 ]</span>
      </div>

      <div class="actions">
        <button type="reset" class="btn btn-ghost" onclick="resetAll()">重置</button>
        <button type="submit" class="btn btn-primary" id="sbm" disabled>
          <span id="sbmTxt">请先选择固件</span>
        </button>
      </div>
    </form>
  </div>

  <div class="footer"><div class="bar"></div>MOCHAN · OneUI 8.5 · OTA Service</div>
</div>

<script>
const $=s=>document.querySelector(s);
const log=(m,cls)=>{
  const el=$('#log');
  const ln=document.createElement('span');ln.className='ln '+(cls||'');ln.textContent='• '+m;
  el.appendChild(ln);el.scrollTop=el.scrollHeight;
};
function fmtSize(n){if(n<1024)return n+' B';if(n<1024*1024)return(n/1024).toFixed(1)+' KB';return(n/1024/1024).toFixed(2)+' MB';}

const steps=$('.steps .s');function setStep(i){steps.forEach((s,idx)=>s.classList.toggle('a',idx<=i));}

/* File picker & drop */
const f=$('#firmware'),dr=$('#drop'),fName=$('#fName'),fHint=$('#fHint'),fSel=$('#fSel'),sbm=$('#sbm'),sbmTxt=$('#sbmTxt');
function setFile(file){
  if(!file){return;}
  const ok= /\.bin$/i.test(file.name) || file.type==='application/octet-stream';
  if(!ok){
    log('文件类型错误：'+file.name,'err');fName.textContent='文件类型不支持，仅支持 .bin';
    fSel.style.display='none';sbm.disabled=true;sbmTxt.textContent='请先选择固件';return;
  }
  fName.textContent=file.name;
  fHint.textContent=fmtSize(file.size)+' · 最后修改：'+new Date(file.lastModified).toLocaleString();
  fSel.style.display='inline-flex';fSel.innerHTML='✅ <span style="max-width:220px;overflow:hidden;text-overflow:ellipsis">'+file.name+'</span>';
  fSel.classList.add('ok');
  sbm.disabled=false;sbmTxt.textContent='⬆ 开始升级';
  log('已选择：'+file.name+' ('+fmtSize(file.size)+')','ok');
  setStep(1);
}
f.addEventListener('change',e=>{if(e.target.files&&e.target.files[0])setFile(e.target.files[0]);});
['dragenter','dragover'].forEach(ev=>dr.addEventListener(ev,e=>{e.preventDefault();dr.classList.add('drag');}));
['dragleave','drop'].forEach(ev=>dr.addEventListener(ev,e=>{e.preventDefault();dr.classList.remove('drag');}));
dr.addEventListener('drop',e=>{if(e.dataTransfer.files&&e.dataTransfer.files[0]){f.files=e.dataTransfer.files;setFile(e.dataTransfer.files[0]);}});

/* Reset */
function resetAll(){
  f.value='';fName.textContent='点击选择或拖拽 .bin 文件到此处';
  fHint.textContent='仅支持 .bin 固件文件 · 建议 ≤ 4MB';
  fSel.style.display='none';sbm.disabled=true;sbmTxt.textContent='请先选择固件';
  $('#prog').classList.remove('show');$('#bar').style.width='0%';$('#progPct').textContent='0%';
  $('#md5').value='';setStep(0);
}

/* Upload via XHR for progress */
$('#otaForm').addEventListener('submit',e=>{
  e.preventDefault();
  const md5=$('#md5').value.trim().toLowerCase();
  if(!f.files||!f.files[0]){log('未选择固件文件','err');return;}
  if(md5&&!/^[a-f0-9]{32}$/.test(md5)){log('MD5 格式错误 (需要 32 位 hex)','err');return;}
  const fd=new FormData();fd.append('firmware',f.files[0]);
  const xhr=new XMLHttpRequest();
  sbm.disabled=true;sbmTxt.innerHTML='<span class="spin"></span>正在上传…';
  $('#prog').classList.add('show');$('#progLbl').textContent='上传固件中…';
  const url='/update';
  xhr.open('POST',url,true);
  if(md5)xhr.setRequestHeader('X-Firmware-MD5',md5);
  xhr.upload.onprogress=ev=>{
    if(!ev.lengthComputable)return;const p=Math.round(ev.loaded/ev.total*100);
    $('#bar').style.width=p+'%';$('#progPct').textContent=p+'%';
  };
  xhr.onload=()=>{
    if(xhr.status===200&&xhr.responseText.trim()==='OK'){
      $('#bar').style.width='100%';$('#progPct').textContent='100%';$('#progLbl').textContent='写入完成，设备即将重启…';
      log('固件写入成功，设备将在 1 秒后自动重启','ok');setStep(2);
      sbmTxt.innerHTML='✅ 升级完成';
      let n=6;const iv=setInterval(()=>{
        log(''+n+' 秒后返回控制台…','dim');--n;if(n<0){clearInterval(iv);location.href='/';}
      },1000);
    }else{
      log('升级失败：HTTP '+xhr.status+' · '+xhr.responseText,'err');setStep(0);
      sbm.disabled=false;sbmTxt.textContent='重新升级';
    }
  };
  xhr.onerror=()=>{log('网络错误，请检查连接并重试','err');sbm.disabled=false;sbmTxt.textContent='重新升级';};
  xhr.send(fd);
  log('开始上传到 '+url+' ...','dim');if(md5)log('携带 MD5 校验头 X-Firmware-MD5: '+md5,'dim');
});
</script>
</body>
